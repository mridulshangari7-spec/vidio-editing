<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Poppins-500.ttf);font-weight:500}
@font-face{font-family:P;src:url(Poppins-600.ttf);font-weight:600}
@font-face{font-family:P;src:url(Poppins-700.ttf);font-weight:700}
@font-face{font-family:P;src:url(Poppins-800.ttf);font-weight:800}
@font-face{font-family:A;src:url(Anton.woff2)}
@page{size:95.25mm 57.15mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--k:#0b0b10;--p:#a64dff;--m:#ff4fd8;--y:#ffe14d}
.page{width:95.25mm;height:57.15mm;position:relative;overflow:hidden;page-break-after:always;font-family:P,sans-serif;background:var(--k);color:#fff}
.page:last-child{page-break-after:auto}
/* neon light streaks like the gym ceiling */
.glow{position:absolute;inset:0;background:radial-gradient(60% 80% at 100% 0%,rgba(166,77,255,.45),transparent 60%),radial-gradient(50% 70% at 0% 100%,rgba(255,79,216,.28),transparent 60%)}
.beams{position:absolute;right:-6mm;top:-6mm;width:60mm;height:40mm}
.beams i{position:absolute;right:0;top:0;height:.55mm;border-radius:1mm;transform-origin:100% 50%;background:linear-gradient(90deg,transparent,var(--b));box-shadow:0 0 1.2mm var(--b)}
.grain{position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 .4mm,transparent .4mm 1.6mm)}
/* front */
.mark{position:absolute;left:7mm;top:7.6mm}
.rh{width:19mm;display:block;filter:drop-shadow(0 0 1.4mm rgba(255,79,216,.55))}
.wm{font:400 13.2mm/0.86 A,Impact,sans-serif;letter-spacing:.01em;margin-top:1.4mm;text-transform:uppercase}
.wm span{display:block;font-size:6.4mm;letter-spacing:.42em;background:linear-gradient(90deg,var(--m),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:.8mm}
.loc{font-weight:700;font-size:1.7mm;letter-spacing:.26em;color:rgba(255,255,255,.7);margin-top:1.6mm}
.fr{position:absolute;left:51mm;right:6.6mm;top:11.4mm}
.fr .k{font-weight:700;font-size:1.85mm;letter-spacing:.22em;color:var(--m)}
.fr h1{font-weight:800;font-size:4.5mm;line-height:1.06;margin-top:1.2mm}
.fr h1 b{display:block;color:var(--y)}
.stars{display:flex;gap:.5mm;margin-top:1.8mm}
.stars svg{width:3.7mm;height:3.7mm;fill:var(--y);filter:drop-shadow(0 0 .6mm rgba(255,225,77,.6))}
.tap{display:inline-flex;align-items:center;gap:1.3mm;margin-top:2.2mm;background:linear-gradient(90deg,var(--m),var(--p));color:#fff;border-radius:3mm;padding:1.1mm 2.6mm 1.1mm 1.8mm;font-weight:800;font-size:2mm;letter-spacing:.14em;box-shadow:0 0 2mm rgba(166,77,255,.6)}
.tap svg{width:3.1mm;height:3.1mm}
.pw{position:absolute;right:6.6mm;bottom:6.8mm;text-align:right;color:#fff}
.pw .lbl{font-weight:700;font-size:1.3mm;letter-spacing:.22em;opacity:.8}
.pw .row{display:flex;align-items:center;gap:1mm;justify-content:flex-end;margin-top:.4mm}
.pw svg{width:5.6mm;color:#fff}
.pw .w2{font-weight:700;font-size:1.8mm;letter-spacing:.2em}
.pw .ph{font-weight:700;font-size:1.6mm;line-height:1.35;margin-top:.5mm}
/* back */
.bk{position:absolute;left:0;right:0;top:7.4mm;text-align:center}
.bk h2{font:400 4.6mm/1 A,Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.bk h2 i{font-style:normal;background:linear-gradient(90deg,var(--m),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.bk .sub{font-weight:600;font-size:2.1mm;margin-top:1mm;color:rgba(255,255,255,.85)}
.qrbox{width:23mm;height:23mm;margin:1.6mm auto 0;background:#fff;border-radius:2.4mm;padding:1.7mm;box-shadow:0 0 0 .55mm var(--m),0 0 3mm rgba(255,79,216,.7)}
.qr{width:100%;height:100%;display:block}
.bk .nm{font:400 3.3mm/1 A,Impact,sans-serif;letter-spacing:.12em;margin-top:1.8mm}
.bk .ad{font-weight:600;font-size:1.95mm;margin-top:.7mm;color:rgba(255,255,255,.75)}
.ic{position:absolute;left:6.4mm;bottom:5.6mm;width:9mm;opacity:.9}

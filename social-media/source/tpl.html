<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
:root{--ink:#0d0c0b;--ink2:#1a1816;--paper:#f6f3ec;--gold:#c9982e;--gold2:#e8c06a;--cream:#f5f1e8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#555;font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased}
.story{width:1080px;height:1920px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:150px 84px 0;gap:0;margin:0 auto 40px}
.dark{background:radial-gradient(90% 55% at 50% 40%,#2a2318 0%,var(--ink) 70%);color:var(--cream)}
.light{background:radial-gradient(90% 55% at 50% 42%,#fffdf8 0%,var(--paper) 70%);color:var(--ink)}
.story::before{content:"";position:absolute;inset:36px;border:2px solid rgba(201,152,46,.35);border-radius:40px;pointer-events:none}
.brand{display:flex;align-items:center;gap:18px;font-weight:600;letter-spacing:.32em;font-size:30px}
.brand .bi{width:92px;color:var(--gold)}
.brand small{display:block;font-size:15px;letter-spacing:.5em;font-weight:500;opacity:.6;margin-top:4px}
.eye{margin-top:60px;font-size:26px;font-weight:600;letter-spacing:.22em;color:var(--gold);text-align:center}
h1{margin-top:20px;font-size:92px;line-height:1.02;font-weight:700;text-align:center;letter-spacing:-.02em}
h1 em{font-family:Lora,serif;font-style:italic;font-weight:600;color:var(--gold)}
.light h1 em{color:#a87916}
.hero{margin-top:110px}.hero .big{width:520px;color:var(--gold);filter:drop-shadow(0 0 40px rgba(232,192,106,.35))}
.story .hero+.eye{margin-top:60px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:70px;max-width:880px}
.chips span{font-size:27px;font-weight:500;padding:16px 28px;border-radius:999px;border:2px solid rgba(232,192,106,.45);color:var(--cream);background:rgba(255,255,255,.04)}
.scene{position:relative;width:100%;height:620px;margin-top:40px}
.bl{list-style:none;margin-top:30px;display:grid;gap:18px;width:100%;max-width:880px}
.bl li{display:flex;gap:20px;align-items:flex-start;font-size:33px;line-height:1.35;font-weight:500}
.bl i{flex:none;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#fff;font-style:normal;display:grid;place-items:center;font-size:26px;margin-top:2px}
.dark .bl li{color:rgba(245,241,232,.92)}
.cta{position:absolute;bottom:250px;left:84px;right:84px;height:132px;border-radius:999px;background:var(--gold);color:#fff;display:flex;align-items:center;gap:22px;padding:0 44px 0 22px;box-shadow:0 20px 50px rgba(201,152,46,.35)}
.cta .wa{width:92px;height:92px;border-radius:50%;background:#25d366;display:grid;place-items:center;flex:none}
.cta .wa svg{width:52px;height:52px;color:#fff}
.cta b{font-size:34px;font-weight:600;flex:1;line-height:1.1}
.cta em{font-style:normal;font-size:30px;font-weight:700;white-space:nowrap}
/* card + phone */
.card{position:absolute;left:30px;top:190px;width:470px;height:296px;border-radius:30px;background:linear-gradient(145deg,#1d1b18,#060606);border:2px solid rgba(232,192,106,.5);box-shadow:0 40px 80px rgba(0,0,0,.45);color:var(--gold2);padding:34px;z-index:2;transform:rotate(-8deg)}
.card .ci{width:150px;color:var(--gold2)}
.card p{position:absolute;left:34px;bottom:58px;font-size:30px;font-weight:600;letter-spacing:.14em;color:#fff}
.card small{position:absolute;left:34px;bottom:28px;font-size:16px;letter-spacing:.42em;opacity:.6}
.waves{position:absolute;right:36px;top:34px;width:80px;height:80px}
.waves i{position:absolute;right:0;top:50%;border:5px solid var(--gold2);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:translateY(-50%) rotate(45deg)}
.waves i:nth-child(1){width:30px;height:30px;right:24px}.waves i:nth-child(2){width:54px;height:54px;right:12px}.waves i:nth-child(3){width:78px;height:78px;right:0}
.phone{position:absolute;right:50px;top:0;width:360px;height:620px;border-radius:64px;background:#111;padding:16px;box-shadow:0 50px 90px rgba(0,0,0,.4)}
.phone.solo{left:50%;right:auto;transform:translateX(-50%);width:420px}
.phone .notch{position:absolute;left:50%;top:26px;width:120px;height:30px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:2}
.phone .scr{width:100%;height:100%;border-radius:50px;background:#fff;color:#1c1b19;overflow:hidden;padding:76px 28px 26px;font-size:23px}
.scr b{display:block;font-size:32px;font-weight:700}
.g span{display:block;color:#666;margin-top:8px}
.stars{display:flex;gap:4px;margin-top:34px}.stars svg{width:54px;height:54px}
.btn,.fbtn,.ord,.paid{margin-top:36px;height:70px;border-radius:40px;background:#1a73e8;color:#fff;display:grid;place-items:center;font-weight:600;font-size:26px}
.ig .av{width:130px;height:130px;border-radius:50%;margin:0 auto 22px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);padding:8px}
.ig{text-align:center}.ig span{display:block;color:#666}
.fbtn{background:#0095f6}.yt{margin-top:18px;height:76px;border-radius:40px;background:#ff0000;color:#fff;display:grid;place-items:center;font-weight:600}
.mn .tabs{display:flex;gap:10px;margin:22px 0 10px}.mn .tabs i{font-style:normal;font-size:20px;font-weight:600;padding:8px 16px;border-radius:30px;background:#f0ece4}.mn .tabs i.on{background:#5f8a5a;color:#fff}
.it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed #ddd}.it b{font-size:24px}.it small{color:#666;font-size:22px}.it div{flex:1}.it em{font-style:normal;width:46px;height:46px;border-radius:12px;border:2px solid #5f8a5a;color:#5f8a5a;display:grid;place-items:center;font-size:28px;font-weight:700}
.d{width:22px;height:22px;border:2px solid;border-radius:4px;flex:none}.d.v{border-color:#3f8a3a;background:radial-gradient(#3f8a3a 35%,transparent 40%)}.d.n{border-color:#a83a2c;background:radial-gradient(#a83a2c 35%,transparent 40%)}
.ord{background:#25d366;margin-top:30px}
.browser{position:absolute;left:50%;top:20px;width:860px;height:580px;transform:translateX(-50%);border-radius:28px;background:#1d1b18;border:2px solid rgba(232,192,106,.35);overflow:hidden;box-shadow:0 50px 90px rgba(0,0,0,.45)}
.browser .bar{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#0f0e0c}.browser .bar i{width:16px;height:16px;border-radius:50%;background:#555}.browser .bar span{margin-left:18px;font-size:20px;color:#aaa;background:#222;padding:6px 18px;border-radius:20px}
.pg{padding:40px}.pg .hb{height:210px;border-radius:20px;background:linear-gradient(120deg,#c9982e,#6b4a33 50%,#1d1b18);background-size:200% 200%;animation:sh 4s ease-in-out infinite alternate}
.pg .l1{height:28px;width:70%;border-radius:10px;background:#3a352e;margin-top:30px}.pg .l2{height:22px;width:50%;border-radius:10px;background:#2c2823;margin-top:16px}
.pg .row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}.pg .row div{height:120px;border-radius:16px;background:#2c2823}
@keyframes sh{to{background-position:100% 100%}}
.flow{position:absolute;left:50%;top:20px;transform:translateX(-50%);width:760px;display:flex;flex-direction:column;align-items:center}
.node{width:100%;display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto auto;column-gap:24px;align-items:center;background:#fff;border-radius:28px;padding:22px 30px;box-shadow:0 24px 50px rgba(60,45,30,.14);border:2px solid rgba(201,152,46,.25)}
.node span{grid-row:1/3;width:96px;height:96px;border-radius:26px;background:#f5ecd9;display:grid;place-items:center;font-size:56px}
.node b{font-size:38px}.node small{font-size:28px;color:#777}
.arr{width:4px;height:44px;background:linear-gradient(var(--gold),transparent);margin:6px 0}
.up{text-align:center}.amt{font-size:76px;font-weight:700;margin:36px 0 24px}.apps{display:flex;gap:10px;justify-content:center}.apps i{font-style:normal;font-size:20px;font-weight:600;padding:10px 16px;border-radius:14px;background:#f2f2f2}
.paid{background:#1e9e53}
.rc .r{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px dashed #ddd;font-size:23px}.rc .r.t{font-weight:700;font-size:28px;border:0}
.rc b{margin-bottom:20px}.ai{margin-top:24px;padding:18px;border-radius:18px;background:#f5ecd9;color:#7a5a12;font-weight:600;font-size:21px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:50px;width:100%;max-width:900px}
.grid4 div{border-radius:30px;padding:36px;background:rgba(255,255,255,.05);border:2px solid rgba(232,192,106,.3)}
.grid4 span{font-size:64px}.grid4 b{display:block;font-size:40px;margin-top:14px}.grid4 small{display:block;font-size:27px;opacity:.75;margin-top:6px;line-height:1.35}
.hub b{text-align:center;margin-bottom:24px}.hl{display:flex;align-items:center;gap:14px;padding:13px 16px;margin-top:10px;border-radius:20px;background:#f6f2ea;font-weight:600;font-size:23px}.hl span{width:50px;height:50px;border-radius:14px;background:#0d0c0b;color:#e8c06a;display:grid;place-items:center;font-size:26px}
.work{position:relative;width:100%;height:600px;margin-top:40px}
.work img{position:absolute;width:600px;border-radius:30px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.work .w1{left:-10px;top:10px;transform:rotate(-6deg)}.work .w2{right:-10px;bottom:10px;transform:rotate(5deg)}
.wtxt{margin-top:10px;font-size:30px;line-height:1.45;text-align:center;max-width:860px;opacity:.85}
.c{margin-top:40px}.lead{margin-top:30px;font-size:34px;line-height:1.45;text-align:center;max-width:820px;color:#555}
.big.gold{width:460px}
.qrbox{margin-top:40px;background:#fff;border-radius:36px;padding:36px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 30px 60px rgba(60,45,30,.14);border:3px solid var(--gold)}
.qrbox svg{width:250px;height:250px}.qrbox span{font-size:26px;font-weight:600;color:#555}
.contact{margin-top:30px;text-align:center;display:grid;gap:8px}.contact b{font-size:52px}.contact span{font-size:30px;color:#666}
/* animation (video mode) */
.anim .a0,.anim .a1,.anim .a2,.anim .a3,.anim .a4,.anim .a5{opacity:0;transform:translateY(50px);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.anim .a0{animation-delay:.1s}.anim .a1{animation-delay:.35s}.anim .a2{animation-delay:.7s}.anim .a3{animation-delay:1.1s}.anim .a4{animation-delay:1.5s}.anim .a5{animation-delay:1.9s}
@keyframes up{to{opacity:1;transform:none}}
.anim .tapper{animation:tap 3s ease-in-out 1.6s infinite}
@keyframes tap{0%,100%{transform:rotate(-8deg) translate(0,0)}35%,55%{transform:rotate(-2deg) translate(150px,-40px)}}
.anim .rp{animation:glow 3s ease-in-out 1.6s infinite}
@keyframes glow{0%,30%,100%{box-shadow:0 50px 90px rgba(0,0,0,.4)}45%{box-shadow:0 0 0 14px rgba(232,192,106,.55),0 50px 90px rgba(0,0,0,.4)}}
.anim .stars svg{transform:scale(0);animation:pop .4s cubic-bezier(.3,1.6,.5,1) forwards}
.anim .stars svg:nth-child(1){animation-delay:2.2s}.anim .stars svg:nth-child(2){animation-delay:2.35s}.anim .stars svg:nth-child(3){animation-delay:2.5s}.anim .stars svg:nth-child(4){animation-delay:2.65s}.anim .stars svg:nth-child(5){animation-delay:2.8s}
@keyframes pop{to{transform:scale(1)}}
.anim .waves i{animation:pulse 1.4s ease-in-out infinite}.anim .waves i:nth-child(2){animation-delay:.2s}.anim .waves i:nth-child(3){animation-delay:.4s}
@keyframes pulse{50%{opacity:.25}}
.anim .hero .big{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 70px rgba(232,192,106,.7))}}
</style></head><body>
/*STORIES*/
<script>
var q=new URLSearchParams(location.search);
if(q.get('anim')){document.body.classList.add('anim');}
if(q.get('s')){document.querySelectorAll('.story').forEach(function(s){ if(s.id!=='s'+q.get('s')) s.remove(); else s.style.margin='0'; }); document.body.style.background='#000';}
</script>
</body></html>

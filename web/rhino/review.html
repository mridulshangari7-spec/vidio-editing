<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rate Rhino's Gym</title>
<meta name="theme-color" content="#e3e4e9">
<style>
  @font-face{font-family:Inter;src:url(site/inter-400.woff2) format("woff2");font-weight:400}
  @font-face{font-family:Inter;src:url(site/inter-500.woff2) format("woff2");font-weight:500}
  @font-face{font-family:Inter;src:url(site/inter-600.woff2) format("woff2");font-weight:600 700}
  :root{--paper:#e3e4e9;--ink:#000;--soft:rgba(0,0,0,.5);--hair:rgba(0,0,0,.08);--teal:#1f6f86;--y:#f2a93b}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:radial-gradient(120% 80% at 50% 0%,#eceef2,var(--paper) 55%,#d6d8df)}
  body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100svh}
  a{color:inherit;text-decoration:none}
  .top{padding:max(18px,env(safe-area-inset-top)) 20px 0}
  .top .w{display:flex;align-items:center;gap:10px}
  .top img{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--hair)}
  .top b{display:block;font-size:17px;font-weight:500;letter-spacing:-.04em} .top span{font-size:12.5px;color:var(--soft)}
  .top .bk{margin-left:auto;height:36px;padding:0 16px;border-radius:999px;background:#000;color:#fff;display:inline-flex;align-items:center;font-size:14px;font-weight:500;letter-spacing:-.03em}
  .w{width:min(480px,100%);margin:0 auto}
  .app{padding:0 20px calc(30px + env(safe-area-inset-bottom))}
  .scr{margin-top:12vh;animation:in .6s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  h1{font-size:clamp(40px,11vw,56px);font-weight:500;line-height:.98;letter-spacing:-.06em}
  .lead{margin-top:12px;font-size:17px;color:var(--soft);letter-spacing:-.02em}
  .stars{margin-top:34px;display:flex;gap:8px}
  .stars button{flex:1;aspect-ratio:1;border:0;background:#fff;border-radius:20px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 14px 30px -22px rgba(20,20,40,.45);cursor:pointer;display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  .stars button:active{transform:scale(.9)}
  .stars svg{width:58%;height:58%;fill:#e1e2e7;transition:fill .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
  .stars button.on svg{fill:var(--y);transform:scale(1.1) rotate(-8deg)}
  .mood{margin-top:18px;font-size:22px;font-weight:500;letter-spacing:-.04em;min-height:28px}
  textarea{margin-top:18px;width:100%;min-height:120px;border:0;border-radius:20px;padding:15px;font:inherit;font-size:16px;line-height:1.45;resize:vertical;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
  textarea:focus{outline:2px solid var(--teal)}
  .btn{margin-top:18px;width:100%;height:58px;border:0;border-radius:999px;font:inherit;font-size:16px;font-weight:500;letter-spacing:-.02em;cursor:pointer;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .3s}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.25;cursor:default}
  .alt{margin-top:14px;text-align:center;font-size:14px;color:var(--soft)} .alt a{text-decoration:underline;text-underline-offset:3px}
  .done{text-align:left}
  .done .big{font-size:64px}
  .done h1{margin-top:14px}
  .foot{margin-top:60px;text-align:center;font-size:12.5px;color:var(--soft)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="st" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></symbol></defs></svg>
<div class="top"><div class="w"><img src="img/logo.png" alt=""><div><b>Rhino's Gym</b><span id="area"></span></div><a class="bk" href="./">Home</a></div></div>

<main class="app w">
  <section class="scr" id="s1">
    <h1>How was your workout?</h1>
    <p class="lead">Tap the stars to rate Rhino's Gym.</p>
    <div class="stars" id="stars"></div>
    <div class="mood" id="mood"></div>
    <textarea id="txt" placeholder="What can we do better?" hidden></textarea>
    <button class="btn" id="send" type="button" disabled>Send</button>
    <p class="alt" id="alt" hidden><a href="#" id="toG">Post on Google instead</a></p>
  </section>

  <section class="scr done" id="s3" hidden>
    <div class="big" id="tEmoji">🙏</div>
    <h1 id="tHead">Thank you!</h1>
    <p class="lead" id="tText"></p>
    <a class="btn" href="./">Back to Rhino's Gym</a>
  </section>
  <p class="foot">Smart card by Infinity Technologies</p>
</main>

<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id), LOW=2; let stars=0;
$("area").textContent=GYM.area;
const MOODS=["","Very bad 😞","Not good 😕","Okay 😐","Good 💪","Loved it! 🔥"];
$("stars").innerHTML=[1,2,3,4,5].map(n=>`<button type="button" aria-label="${n} star"><svg><use href="#st"/></svg></button>`).join("");
$("stars").querySelectorAll("button").forEach((b,i)=>b.addEventListener("click",()=>{
  stars=i+1; $("stars").querySelectorAll("button").forEach((x,j)=>x.classList.toggle("on",j<stars));
  $("mood").textContent=MOODS[stars]; const low=stars<=LOW;
  $("txt").hidden=!low; $("alt").hidden=!low; $("send").disabled=false;
  if(low) setTimeout(()=>$("txt").focus(),150);
}));
function thanks(g){ $("s1").hidden=true; $("s3").hidden=false;
  $("tEmoji").textContent=g?"🎉":"🙏"; $("tHead").textContent=g?"Thank you, champ!":"Thanks for telling us";
  $("tText").textContent=g?"Your review helps more people find Rhino's.":"The owner will personally look into it."; }
function toGoogle(){ thanks(true); location.href=GYM.google; }
function toOwner(){
  const msg=`${"⭐".repeat(stars)} (${stars}/5) feedback for Rhino's Gym:\n${$("txt").value.trim()||"(no details)"}`;
  window.open(`https://wa.me/${GYM.whatsapp}?text=${encodeURIComponent(msg)}`,"_blank"); thanks(false); }
$("send").addEventListener("click",()=>stars<=LOW?toOwner():toGoogle());
$("toG").addEventListener("click",e=>{ e.preventDefault(); toGoogle(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen · Nutrition Treat</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101a23">
<style>
  @font-face{font-family:S;src:url(Arvo-700.woff2);font-weight:700}
  @font-face{font-family:P;src:url(Poppins-400.ttf);font-weight:400}
  @font-face{font-family:P;src:url(Poppins-600.ttf);font-weight:600}
  @font-face{font-family:P;src:url(Poppins-700.ttf);font-weight:700}
  :root{--bg:#101a23;--panel:#172431;--card:#203142;--line:#2c4052;--ink:#eef2f4;--soft:#9fb2bf;--t:#3f7a8a;--t2:#7fb0bf;--g:#2fbf6a;--y:#f2b84b;--r:#ef5350}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:P,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100svh}
  button{font:inherit;color:inherit;cursor:pointer;border:0}
  .lock{min-height:100svh;display:grid;place-items:center;text-align:center;padding:20px}
  .lock img{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--t)}
  .lock h1{margin-top:14px;font:700 26px/1.1 S,serif} .lock p{color:var(--soft);margin-top:6px}
  .pin{margin-top:18px;width:200px;text-align:center;font:inherit;font-size:26px;letter-spacing:.4em;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
  .go{display:block;margin:14px auto 0;background:var(--g);color:#06210f;font-weight:700;font-size:17px;padding:14px 26px;border-radius:14px}
  .err{color:var(--r);margin-top:10px;font-weight:700;min-height:20px}
  header{position:sticky;top:0;z-index:10;background:rgba(16,26,35,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header img{width:38px;height:38px;border-radius:50%;background:#fff}
  header h1{font:700 19px/1.1 S,serif}
  .live{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--g)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:bl 1.4s infinite}
  @keyframes bl{50%{opacity:.3}}
  .stats{margin-left:auto;display:flex;gap:16px;font-size:13px;color:var(--soft)}
  .stats b{color:var(--ink);font-size:16px}
  .board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:12px;padding:12px 16px 30px;overflow-x:auto}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;min-height:70vh}
  .col h2{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:.08em;padding:4px 4px 10px}
  .col h2 b{background:var(--card);border-radius:20px;padding:2px 9px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;animation:pop .3s}
  .card.new{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
  @keyframes pop{from{transform:scale(.94);opacity:0}}
  .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ch .no{font:700 22px/1 S,serif}
  .ch .nm{font-size:14px;font-weight:600;margin-top:4px}
  .ch .tm{font-size:12px;color:var(--soft);text-align:right}
  .wh{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;background:#1d3a44;color:var(--t2)}
  .its{margin-top:8px;font-size:15px;line-height:1.5}
  .its b{display:inline-block;min-width:26px;color:var(--y)}
  .nt{margin-top:6px;font-size:13px;color:#ffd98a;background:#3a2c0d;border-radius:8px;padding:5px 8px}
  .pm{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;background:#14212c;border-radius:10px;padding:7px 9px}
  .pm.ok{color:var(--g)}
  .pm button{background:var(--g);color:#06210f;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12.5px}
  .fl{margin-top:8px;font-size:11.5px;font-weight:700;background:#4a1d1b;color:#ffb4ae;border-radius:20px;padding:3px 9px;display:inline-block}
  .acts{margin-top:10px;display:flex;gap:6px}
  .acts button{flex:1;border-radius:10px;padding:11px;font-weight:700;font-size:14px}
  .a-ok{background:var(--g);color:#06210f} .a-no{background:#4a1d1b;color:#ffb4ae;flex:0 0 auto!important;padding:11px 14px!important}
  .a-next{background:var(--t);color:#fff}
  .empty{color:var(--soft);font-size:13px;text-align:center;padding:24px 6px}
  .foot{text-align:center;font-size:11px;letter-spacing:.12em;color:#55697a;padding-bottom:16px}
  @media (max-width:820px){.board{grid-template-columns:repeat(3,84vw);scroll-snap-type:x mandatory}.col{scroll-snap-align:start}}
</style>
</head>
<body>
<div class="lock" id="lock"><div>
  <img src="img/logo.png" alt=""><h1>Nutrition Treat · Kitchen</h1><p>Keep this screen open in the kitchen.</p>
  <input class="pin" id="pin" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
  <button class="go" id="go" type="button">Open kitchen screen</button>
  <div class="err" id="err"></div>
</div></div>

<div id="app" hidden>
  <header><img src="img/logo.png" alt=""><h1>Nutrition Treat · Kitchen</h1><div class="live"><i></i>LIVE</div>
    <div class="stats"><div>Orders today <b id="sN">0</b></div><div>Paid <b id="sP">₹0</b></div><div>Due <b id="sD">₹0</b></div></div></header>
  <div class="board">
    <section class="col"><h2>🆕 NEW <b id="n0">0</b></h2><div id="c0"></div></section>
    <section class="col"><h2>🔥 PREPARING <b id="n1">0</b></h2><div id="c1"></div></section>
    <section class="col"><h2>✅ READY <b id="n2">0</b></h2><div id="c2"></div></section>
  </div>
  <p class="foot">SMART ORDERING BY INFINITY TECHNOLOGIES</p>
</div>

<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
let actx=null;
function beep(n=2){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=i%2?1175:880; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+i*.22; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.start(t); o.stop(t+.21); } }catch(e){} }
$("pin").addEventListener("keydown",e=>{ if(e.key==="Enter") $("go").click(); });
$("go").addEventListener("click",()=>{ if($("pin").value!==CAFE.kitchenPin){ $("err").textContent="Wrong PIN"; return; } beep(1); $("lock").hidden=true; $("app").hidden=false; start(); });

function start(){
const T0=Date.now(), orders={}, st={}, paid={}, byDev={};
const COL={pending:0,accepted:1,preparing:1,ready:2};
const ago=ts=>{ const m=Math.round((Date.now()-ts)/60000); return m<1?"just now":m+" min ago"; };
const today=ts=>new Date(ts).toDateString()===new Date().toDateString();
function card(o){
  const s=st[o.id]||"pending";
  const items=o.items.map(([id,q])=>`<div><b>${+q}×</b>${esc((CAFE.items[id]||{n:"Unknown item"}).n)}</div>`).join("");
  const acts=s==="pending"?`<button class="a-ok" data-a="preparing">✓ Accept</button><button class="a-no" data-a="rejected">✕</button>`:
    s==="ready"?`<button class="a-next" data-a="served">Collected / Served</button>`:`<button class="a-ok" data-a="ready">Mark ready</button>`;
  const pm=paid[o.id]?`<div class="pm ok">✓ Paid ${inr(o.total)}</div>`:`<div class="pm"><span>${o.pay==="upi"?"📱 UPI: check payment":"💵 Collect at counter"} · ${inr(o.total)}</span><button data-paid="${o.id}">Paid ✓</button></div>`;
  return `<div class="card${s==="pending"?" new":""}" data-id="${o.id}"><div class="ch"><div><div class="no">#${+o.no}</div><div class="nm">${esc(o.name)}</div></div><div class="tm">${new Date(o.ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}<br>${ago(o.ts)}</div></div>
    <span class="wh">📍 ${esc(o.where)}</span><div class="its">${items}</div>${o.note?`<div class="nt">📝 ${esc(o.note)}</div>`:""}
    ${o.many&&s==="pending"?`<div class="fl">Many orders from one phone</div>`:""}${pm}<div class="acts">${acts}</div></div>`;
}
function draw(){
  const cols=[[],[],[]]; let n=0, p=0, d=0;
  Object.values(orders).sort((a,b)=>a.ts-b.ts).forEach(o=>{ const s=st[o.id]||"pending";
    if(today(o.ts)&&s!=="rejected"){ n++; paid[o.id]?p+=o.total:d+=o.total; }
    if(s in COL) cols[COL[s]].push(o); });
  cols.forEach((c,i)=>{ $("c"+i).innerHTML=c.map(card).join("")||`<div class="empty">${["No new orders","Nothing cooking","Nothing waiting"][i]}</div>`; $("n"+i).textContent=c.length; });
  $("sN").textContent=n; $("sP").textContent=inr(p); $("sD").textContent=inr(d);
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-a]"); if(a){ const id=a.closest("[data-id]").dataset.id;
    if(a.dataset.a==="rejected"&&!confirm("Reject this order?")) return;
    RT.send("status",{type:"status",id,s:a.dataset.a}); return; }
  const p=e.target.closest("[data-paid]"); if(p) RT.send("status",{type:"paid",id:p.dataset.paid});
});
RT.listen("status",m=>{ if(m.type==="status"){ st[m.id]=m.s; draw(); } if(m.type==="paid"){ paid[m.id]=true; draw(); } });
RT.listen("orders",o=>{
  if(o.type!=="order"||!Array.isArray(o.items)) return;
  o.total=o.items.reduce((a,[id,q])=>a+((CAFE.items[id]||{p:0}).p)*(+q||0),0);   // recalc from the menu, never trust the phone
  const recent=(byDev[o.dev]=byDev[o.dev]||[]).filter(ts=>o.ts-ts<5*60000).length; byDev[o.dev].push(o.ts); o.many=recent>=2;
  orders[o.id]=o; if(o.ts>T0-5000) beep(3); draw();
});
draw(); setInterval(draw,30000);
}
</script>
</body>
</html>

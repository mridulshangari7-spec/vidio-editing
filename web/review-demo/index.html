<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rate your visit</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f3ec">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1b1712;--soft:#6a6259;--faint:#a39a8f;--bg:#f7f3ec;--card:#fff;--line:#e8e1d6;--brand:#7a4b2a;--brand2:#c98a4b;--star:#f5b301;--wa:#25d366}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:var(--bg)}
  body{font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100svh}
  .app{width:min(460px,100%);margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
  .brand{display:flex;align-items:center;gap:12px}
  .lg{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:0 8px 18px -8px rgba(122,75,42,.7)}
  .brand b{display:block;font-size:18px}
  .brand span{display:block;font-size:13px;color:var(--soft);margin-top:1px}
  .scr{margin-top:34px;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  h1{font-size:30px;line-height:1.08;letter-spacing:-.02em;font-weight:800;text-align:center}
  .lead{margin-top:8px;font-size:15px;color:var(--soft);text-align:center}
  .stars{margin-top:24px;display:flex;justify-content:space-between;gap:6px}
  .stars button{flex:1;aspect-ratio:1;border:0;background:var(--card);border-radius:16px;box-shadow:0 1px 0 var(--line),0 6px 16px -10px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
  .stars button:active{transform:scale(.92)}
  .stars svg{width:62%;height:62%;fill:#e6dfd3;transition:fill .15s,transform .2s}
  .stars button.on svg{fill:var(--star);transform:scale(1.08)}
  .mood{margin-top:14px;text-align:center;font-size:17px;font-weight:700;min-height:22px}
  textarea{margin-top:16px;width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:16px;padding:13px;font:inherit;font-size:16px;line-height:1.45;resize:vertical;background:#fffdf9;color:var(--ink);animation:in .3s ease}
  textarea:focus{outline:2px solid var(--brand2);border-color:transparent}
  .btn{margin-top:16px;width:100%;min-height:58px;border:0;border-radius:16px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;transition:opacity .2s}
  .btn:disabled{opacity:.3;cursor:default}
  .alt{margin-top:14px;text-align:center;font-size:13px;color:var(--faint)}
  .alt a{color:var(--faint)}
  .done{text-align:center;padding-top:20px}
  .done .big{font-size:64px}
  .done h1{margin-top:10px}
  .extras{margin-top:24px;display:grid;gap:10px;text-align:left}
  .xb{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;text-decoration:none;color:var(--ink);font:inherit;cursor:pointer;width:100%;text-align:left}
  .xb span{flex:none;width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:21px}
  .xb b{display:block;font-size:15px}
  .xb small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
  .xb.gift{border:2px solid var(--wa);background:#f1fdf5}
  .toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:10px 16px;border-radius:30px;transition:all .3s;z-index:60;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .badge{position:fixed;right:10px;bottom:8px;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--faint)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="st" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></symbol></defs></svg>

<main class="app">
  <div class="brand"><div class="lg">☕</div><div><b id="bName"></b><span id="bArea"></span></div></div>

  <section class="scr" id="s1">
    <h1>How was your visit?</h1>
    <p class="lead">Tap the stars to rate us.</p>
    <div class="stars" id="stars"></div>
    <div class="mood" id="mood"></div>
    <textarea id="txt" placeholder="What could we do better?" hidden></textarea>
    <button class="btn" id="send" type="button" disabled>Send</button>
    <p class="alt" id="alt" hidden><a href="#" id="toG">Post on Google instead</a></p>
  </section>

  <section class="scr done" id="s3" hidden>
    <div class="big" id="tEmoji">🙏</div>
    <h1 id="tHead">Thank you!</h1>
    <p class="lead" id="tText"></p>
    <div class="extras">
      <a class="xb gift" id="xCoupon" target="_blank" rel="noopener"><span>🎁</span><div><b id="xCouponT">Get 10% OFF next visit</b><small>Coupon comes on WhatsApp</small></div></a>
      <a class="xb" id="xStamp" href="../stamp-demo/"><span>☕</span><div><b>Start your stamp card</b><small>5 visits = 1 free coffee</small></div></a>
      <button class="xb" id="xSave" type="button"><span>📇</span><div><b>Save our number</b><small>See daily specials on Status</small></div></button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<div class="badge">DEMO · INFINITY</div>

<script>
/* ===== business settings ===== */
const BIZ={
  name:"Brew & Bloom Café", area:"Demo café · Amritsar",
  whatsapp:"917986404564",   // owner's WhatsApp: 1–2 star feedback goes here
  phone:"+917986404564",
  google:"https://www.google.com/search?q=Brew+and+Bloom+Cafe",   // the café's Google write-review link
  lowUpTo:2                  // 1★ and 2★ go to the owner; 3★–5★ go to Google
};
/* ============================== */
/* real-flow test: ?real opens Grain by Elgin's actual Google review page */
if(new URLSearchParams(location.search).has("real")){ BIZ.name="Grain by Elgin"; BIZ.area="Live Google test · Amritsar"; BIZ.google="https://search.google.com/local/writereview?placeid=ChIJZ1DInKFlGTkRkBKDXG9Mh7E"; }

const $=id=>document.getElementById(id); let stars=0;
document.title=`Rate your visit – ${BIZ.name}`; $("bName").textContent=BIZ.name; $("bArea").textContent=BIZ.area;
const MOODS=["","Very bad 😞","Not good 😕","Okay 😐","Good 😊","Loved it! 🤩"];
$("stars").innerHTML=[1,2,3,4,5].map(n=>`<button type="button" aria-label="${n} star"><svg><use href="#st"/></svg></button>`).join("");
$("stars").querySelectorAll("button").forEach((b,i)=>b.addEventListener("click",()=>{
  stars=i+1; $("stars").querySelectorAll("button").forEach((x,j)=>x.classList.toggle("on",j<stars));
  $("mood").textContent=MOODS[stars]; const low=stars<=BIZ.lowUpTo;
  $("txt").hidden=!low; $("alt").hidden=!low; $("send").disabled=false;
  if(low) setTimeout(()=>$("txt").focus(),150);
}));

function toast(m){ $("toast").textContent=m; $("toast").classList.add("on"); setTimeout(()=>$("toast").classList.remove("on"),1800); }
function toGoogle(){ thanks(true); location.href=BIZ.google; }
function toOwner(){
  const v=$("txt").value.trim();
  const msg=`${"⭐".repeat(stars)} (${stars}/5) feedback for ${BIZ.name}:\n${v||"(no details)"}`;
  window.open(`https://wa.me/${BIZ.whatsapp}?text=${encodeURIComponent(msg)}`,"_blank");
  thanks(false);
}
$("send").addEventListener("click",()=>stars<=BIZ.lowUpTo?toOwner():toGoogle());
$("toG").addEventListener("click",e=>{ e.preventDefault(); toGoogle(); });

function thanks(g){ $("s1").hidden=true; $("s3").hidden=false;
  $("tEmoji").textContent=g?"🎉":"🙏"; $("tHead").textContent=g?"Thank you so much!":"Thanks for telling us";
  $("tText").textContent=g?"Your review helps other people find us.":"The owner will personally look into it.";
  $("xCouponT").textContent=g?"Get 10% OFF next visit":"Get a coupon for next time";
  $("xCoupon").href=`https://wa.me/${BIZ.whatsapp}?text=${encodeURIComponent(`Hi ${BIZ.name}! Please send my coupon for my next visit 😊`)}`;
  $("xSave").onclick=()=>{ const vcf=`BEGIN:VCARD\nVERSION:3.0\nFN:${BIZ.name}\nORG:${BIZ.name}\nTEL;TYPE=CELL:${BIZ.phone}\nEND:VCARD\n`;
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([vcf],{type:"text/vcard"})); a.download=BIZ.name.replace(/[^\w ]/g,"")+".vcf"; document.body.appendChild(a); a.click(); a.remove(); toast("Tap the file to save the contact"); };
}
</script>
</body>
</html>

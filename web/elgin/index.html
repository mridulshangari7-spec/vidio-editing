<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elgin – Follow us on Instagram</title>
<meta name="description" content="Follow Grain by Elgin, Elgin Café, Lord Elgin Bar and Elgin Hall on Instagram.">
<meta name="theme-color" content="#14201b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#14201b;--bg2:#1b2a24;--cream:#f3ead8;--soft:rgba(243,234,216,.66);--gold:#c9a45c;--line:rgba(243,234,216,.14)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;min-height:100svh;background:radial-gradient(120% 80% at 50% 0%,#24382f 0%,var(--bg) 60%);color:var(--cream);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    padding:max(36px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
  main{max-width:440px;margin:0 auto}
  header{text-align:center;margin-bottom:28px}
  .crest{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;
    font:600 30px/1 "Cormorant Garamond",Georgia,serif;color:var(--gold)}
  h1{margin:0;font:600 40px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.18em;padding-left:.18em}
  .sub{margin:12px 0 0;color:var(--soft);font-size:14px;letter-spacing:.02em}
  .rule{width:46px;height:1px;background:var(--gold);margin:18px auto 0}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  a.acct{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 14px;
    transition:transform .25s ease,border-color .25s ease,background .25s ease}
  a.acct:hover,a.acct:focus-visible{transform:translateY(-2px);border-color:rgba(201,164,92,.6);background:rgba(255,255,255,.06)}
  a.acct:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .ig{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
    background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
  .ig svg{width:26px;height:26px;color:#fff}
  .t b{display:block;font:600 21px/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em}
  .t span{display:block;margin-top:3px;font-size:13px;color:var(--gold)}
  .t small{display:block;margin-top:2px;font-size:12px;color:var(--soft)}
  .go{font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;background:var(--cream);color:var(--bg);white-space:nowrap}
  footer{margin-top:30px;text-align:center;font-size:11.5px;color:rgba(243,234,216,.45);letter-spacing:.02em}
  footer a{color:inherit}
  @media (prefers-reduced-motion:no-preference){
    li{opacity:0;transform:translateY(10px);animation:in .55s cubic-bezier(.22,.61,.36,1) forwards}
    li:nth-child(2){animation-delay:.07s} li:nth-child(3){animation-delay:.14s} li:nth-child(4){animation-delay:.21s}
    @keyframes in{to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="crest">E</div>
    <h1>ELGIN</h1>
    <p class="sub">Follow us on Instagram</p>
    <div class="rule"></div>
  </header>

  <ul>
    <li><a class="acct" href="https://www.instagram.com/grainbyelgin/" target="_blank" rel="noopener">
      <span class="ig"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg></span>
      <span class="t"><b>Grain by Elgin</b><span>@grainbyelgin</span><small>Ranjit Avenue, Amritsar</small></span>
      <span class="go">Follow</span></a></li>
    <li><a class="acct" href="https://www.instagram.com/elgin_cafe/" target="_blank" rel="noopener">
      <span class="ig"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg></span>
      <span class="t"><b>Elgin Café</b><span>@elgin_cafe</span><small>Amritsar</small></span>
      <span class="go">Follow</span></a></li>
    <li><a class="acct" href="https://www.instagram.com/lordelginbar/" target="_blank" rel="noopener">
      <span class="ig"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg></span>
      <span class="t"><b>Lord Elgin Bar</b><span>@lordelginbar</span><small>Cocktails &amp; tapas</small></span>
      <span class="go">Follow</span></a></li>
    <li><a class="acct" href="https://www.instagram.com/elgin_hall/" target="_blank" rel="noopener">
      <span class="ig"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg></span>
      <span class="t"><b>Elgin Hall</b><span>@elgin_hall</span><small>Dalhousie</small></span>
      <span class="go">Follow</span></a></li>
  </ul>

  <footer>Tap powered by <a href="https://growwithinfinity.github.io/" target="_blank" rel="noopener">Infinity Technologies</a></footer>
</main>
</body>
</html>
